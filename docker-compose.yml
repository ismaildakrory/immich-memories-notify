# ============================================================
# IMMICH MEMORIES NOTIFY - DOCKER COMPOSE
# ============================================================
#
# USAGE:
#   docker compose run --rm notify --slot 1              # Run slot 1
#   docker compose run --rm notify --slot 1 --test       # Test mode
#   docker compose run --rm notify --slot 1 --dry-run    # Preview only
#   docker compose run --rm notify --slot 1 --no-delay   # Skip random delay
#   docker compose up -d dashboard                       # Start app
#
# WINDOWS:
#   One notification per configured window per day. Window 1 always sends
#   a memory (birthday pre-empts). Windows 2+ pick from their events list:
#   specials (Then & Now / Trip / Collage) first, then memory/person/album.
#   Logs are rotated (3 x 10 MB) so `docker compose logs` stays usable.
#
# CONFIGURATION:
#   - Secrets (API keys, passwords): .env
#   - Everything else (schedules, settings): config.yaml
#
# DASHBOARD:
#   - Access at http://localhost:5000
#   - Set DASHBOARD_TOKEN env var for authentication
#   - Scheduler runs embedded (supercronic inside this container)
#   - Runs as an unprivileged user; set PUID/PGID in .env to match the
#     owner of config.yaml / .env / state on the host (default 1000)
#   - Docker access only through the docker-socket-proxy service
#
# ============================================================

services:
  # ------------------------------------------------------------
  # Main Service - Run on demand
  # ------------------------------------------------------------
  notify:
    build: .
    container_name: immich-memories-notify
    # On-demand tool only (`docker compose run --rm notify ...`); the "tools"
    # profile keeps a plain `docker compose up -d` from starting it.
    profiles: ["tools"]
    volumes:
      - ./notify:/app/notify:ro
      - ./config.yaml:/app/config.yaml:ro
      - ./VERSION:/app/VERSION:ro
      - ./state:/app/state
      - ./custom_templates:/app/custom_templates
      - /etc/localtime:/etc/localtime:ro
    env_file: .env
    environment:
      - TZ=${TZ:-UTC}
    network_mode: host
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ------------------------------------------------------------
  # Dashboard + Scheduler (single container)
  # ------------------------------------------------------------
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: immich-memories-dashboard
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./state:/app/state
      - ./notify:/app/notify:ro
      - ./dashboard:/app/dashboard:ro
      - ./VERSION:/app/VERSION:ro
      - ./custom_templates:/app/custom_templates:ro
      - ./.env:/app/.env
      - /etc/localtime:/etc/localtime:ro
    env_file: .env
    environment:
      - TZ=${TZ:-UTC}
      - CONFIG_PATH=/app/config.yaml
      - STATE_PATH=/app/state/state.json
      - ENV_PATH=/app/.env
      - DOCKER_HOST=tcp://127.0.0.1:2375   # via docker-socket-proxy
      - PUID=${PUID:-1000}                 # owner of config.yaml/.env/state on the host
      - PGID=${PGID:-1000}
      - DASHBOARD_USER=${DASHBOARD_USER:-admin}
      - DASHBOARD_TOKEN=${DASHBOARD_TOKEN:-}
      - DASHBOARD_PORT=${DASHBOARD_PORT:-5000}
    network_mode: host
    restart: unless-stopped
    depends_on:
      - docker-socket-proxy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ------------------------------------------------------------
  # Docker socket proxy — the dashboard never sees the raw socket.
  # Only container inspect/exec (bundled ntfy user management) is allowed.
  # ------------------------------------------------------------
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: immich-memories-docker-proxy
    environment:
      - CONTAINERS=1   # docker inspect
      - EXEC=1         # docker exec
      - POST=1         # exec create/start are POST requests
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:2375:2375"   # loopback only — the dashboard runs with host networking
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
